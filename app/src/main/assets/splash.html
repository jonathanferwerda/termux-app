<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JawnOS</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #ededed;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 30px; padding: 24px; box-sizing: border-box; }
  .logo { height: 34vh; max-height: 330px; animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 22px rgba(255, 204, 0, 0.30)); }
    50%      { filter: drop-shadow(0 0 58px rgba(255, 204, 0, 0.78)); }
  }
  .status { color: #8e8e8e; font-size: 15px; text-align: center; }
  button { background: #ffcc00; color: #0a0a0a; border: none; border-radius: 13px;
           padding: 14px 24px; font-size: 16px; font-weight: 700; }
  button:active { background: #e6b800; }
</style>
</head>
<body>
  <img class="logo" src="jawn_logo.png" alt="JawnOS">
  <div class="status" id="status">Reaching JawnOS&hellip;</div>
  <button onclick="admin()">Admin Panel</button>
  <script>
    // window.JawnAdmin is the app's admin-gear bridge (JawnWebViewActivity).
    function admin() {
      if (window.JawnAdmin && window.JawnAdmin.open) { window.JawnAdmin.open(); }
    }
    // the app nudges this while it waits for jawn to answer
    window.jawnSplashStatus = function (text) {
      var s = document.getElementById('status');
      if (s && text) { s.textContent = text; }
    };
  </script>
</body>
</html>
